[package]
name = "primeoffice"
version = "0.3.0"
description = "PrimeOffice — Pixel office for your AI coding agents"
authors = ["Phineas"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "primeoffice_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Command line (same exe as the app, see src/cli.rs) and Ctrl+C for `--watch`.
clap = { version = "4.6", features = ["derive"] }
ctrlc = "3.4"
thiserror = "2.0"
rayon = "1.12"
walkdir = "2.5"
globset = "0.4"
# Watch folders (src/utils/watch.rs).
notify = "8.2"
notify-debouncer-full = "0.7"

[dev-dependencies]
tempfile = "3"
# Mock runtime for driving the real IPC commands in tests (`src/ipc_tests.rs`).
tauri = { version = "2", features = ["protocol-asset", "test"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
